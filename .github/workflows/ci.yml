name: Candidate qualification
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    name: qualify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - run: mise run format && git diff --exit-code
      - run: mise run check:setup
      - run: mise run check
      - run: mise run package
      - run: mise run test:publish-environment
      - run: mise run test:browser
        if: matrix.platform == 'linux-x64'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.platform == 'linux-x64'
        with:
          name: browser-evidence-${{ matrix.platform }}
          path: |
            _build/browser/results.json
            _build/browser/cli-evidence.json
            _build/browser/report/
            _build/browser/test-results/
            _build/browser/*.png
          if-no-files-found: warn
          retention-days: 14
      - run: mise run test:consumer -- --prepared
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            _build/package/*.tar.gz
            _build/package/*.sha256
            _build/publish/*.zip
            _build/evidence/*.json
          if-no-files-found: error
          retention-days: 14
