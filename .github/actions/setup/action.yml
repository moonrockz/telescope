name: Pinned Telescope tools
description: Install mise tools and complete the pinned MoonBit core library
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      with:
        version: 2026.10.19
        # The restored macOS yamllint executable could not run; install fresh tools.
        cache: ${{ runner.os != 'macOS' }}
    - name: Complete exact MoonBit installation
      if: runner.os != 'Windows'
      shell: bash
      run: |
        export MOON_HOME="$(mise where http:moonbit)"
        curl --fail --silent --show-error --location https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/install-moonbit.sh"
        bash "$RUNNER_TEMP/install-moonbit.sh" '0.10.17+093cb8f9c'
        echo "MOON_HOME=$(mise where http:moonbit)" >> "$GITHUB_ENV"
        mise where http:moonbit | sed 's|$|/bin|' >> "$GITHUB_PATH"
        "$(mise where http:moonbit)/bin/moonc" -v
        "$(mise where http:moonbit)/bin/moon" update
    - name: Complete exact MoonBit installation on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $moonbitDir = (mise where http:moonbit).Trim()
        $env:MOON_HOME = $moonbitDir
        $env:MOONBIT_INSTALL_VERSION = '0.10.17+093cb8f9c'
        Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
        "$moonbitDir\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        "MOON_HOME=$moonbitDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        & "$moonbitDir\bin\moonc.exe" -v
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & "$moonbitDir\bin\moon.exe" update
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
